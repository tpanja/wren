name: Wren
options:
  bundleIdPrefix: com.wren
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # On-device neural text to speech (Kokoro), same version as HandoffAI.
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: "1.13.8"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Wren:
    type: application
    platform: iOS
    sources:
      - path: Wren
      # Kokoro voice model, copied into the app as-is (tools/fetch-tts-model.sh).
      - path: BundledModels/Kokoro
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wren.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wren
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_FILE: Wren/Info.plist
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Wren uses speech recognition to turn what you say into clear text and speech.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Wren listens through the microphone to recognize speech and say it clearly.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Wren connects to your throat band over Bluetooth to receive the microphone and vibration signals it uses to speak for you.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  WrenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WrenTests]
    dependencies:
      - target: Wren
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.wren.app.tests
schemes:
  Wren:
    build:
      targets:
        Wren: all
        WrenTests: [test]
    test:
      targets: [WrenTests]
