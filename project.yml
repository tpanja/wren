name: Fonos
options:
  bundleIdPrefix: com.fonos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Fonos:
    type: application
    platform: iOS
    sources: [Fonos]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fonos.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fonos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Fonos connects to your throat band over Bluetooth to receive your speech signals."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Fonos turns your throat-band speech into text on this iPhone so it can be spoken clearly."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Fonos can use the iPhone microphone to test translation when your band is not connected."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Fonos/Resources/Info.plist
      properties:
        UIBackgroundModes: [bluetooth-central]
  FonosTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FonosTests]
    dependencies:
      - target: Fonos
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fonos.app.tests
schemes:
  Fonos:
    build:
      targets:
        Fonos: all
        FonosTests: [test]
    test:
      targets: [FonosTests]
